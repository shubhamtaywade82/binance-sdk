# Weekly upstream drift watch for the Postman contract layer.
#
# Diffs the endpoint contracts at the latest binance/binance-api-postman
# commit against contracts/postman-catalog.json. On drift (endpoints added or
# removed, or parameters changed) it:
#   1. re-imports the catalog at that commit and runs the gates; a red
#      known-gaps test means a new upstream endpoint needs implementing or a
#      recorded reason in contracts/postman-known-gaps.json;
#   2. opens or updates the candidate PR on branch `upstream-sync/auto`
#      (never merged automatically, never runs the code generator);
#   3. opens or updates the single `upstream-drift` issue.
#
# A PR opened with the default GITHUB_TOKEN does not trigger ci.yml, which
# is why the gates run here. Set the UPSTREAM_SYNC_TOKEN secret (a PAT with
# contents + pull-requests write) to have normal CI run on the PR as well.

name: Upstream Watch

on:
  schedule:
    - cron: '30 3 * * 1' # Monday 09:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      # Authenticates the GitHub API calls in the import and drift scripts
      # (60 requests/hour unauthenticated; one import fetches ~30).
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Detect upstream drift
        id: drift
        run: |
          set +e
          npm run --silent contracts:upstream-drift -- --out "$RUNNER_TEMP/drift.md"
          code=$?
          # 1 = drift found, anything else non-zero = the check itself failed.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi

      - name: Re-import and run gates
        if: steps.drift.outputs.drifted == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.drift.outputs.sha }}
        run: |
          gates="$RUNNER_TEMP/gates.md"
          logs="$RUNNER_TEMP/gate-logs.md"
          printf '## Gate results\n\n| Gate | Result |\n|---|---|\n' > "$gates"
          : > "$logs"
          # Each gate's own exit code decides the result, never a pipeline's.
          gate() {
            local name=$1; shift
            if "$@" > "$RUNNER_TEMP/gate.log" 2>&1; then
              echo "| \`$name\` | ✅ |" >> "$gates"
            else
              echo "| \`$name\` | ❌ |" >> "$gates"
              { echo "<details><summary>${name} (last 40 lines)</summary>"; echo; echo '```'
                tail -n 40 "$RUNNER_TEMP/gate.log"; echo '```'; echo '</details>'; echo; } >> "$logs"
            fi
          }
          gate "contracts:import-postman --ref ${UPSTREAM_SHA:0:7}" npm run contracts:import-postman -- --ref "$UPSTREAM_SHA"
          gate typecheck npm run typecheck
          gate test npm test
          gate contracts:check npm run contracts:check
          gate build npm run build
          {
            cat "$RUNNER_TEMP/drift.md"; echo; cat "$gates"; echo; cat "$logs"
            echo '## Before merging'
            echo
            echo '- [ ] Implement each added endpoint, or record it in `contracts/postman-known-gaps.json` with a reason'
            echo '- [ ] Removed endpoints: deprecate or remove them from the registry and resources'
            echo '- [ ] Changed parameters: update the request types and Zod schemas'
            echo '- [ ] Map new upstream collections in `COLLECTION_TO_PRODUCT`, or record them as known gaps'
            echo '- [ ] CHANGELOG entry and version bump if the public surface changed'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Ensure upstream-drift label
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create upstream-drift --color B60205 --description 'Postman contract is behind binance/binance-api-postman' --force

      - name: Open or update candidate PR
        id: pr
        if: steps.drift.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          branch: upstream-sync/auto
          title: 'chore(contracts): re-import drifted Binance Postman collections (automated)'
          commit-message: 'chore(contracts): re-import drifted Binance Postman collections (automated)'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: upstream-drift

      - name: Open or update upstream-drift issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          body="$RUNNER_TEMP/issue-body.md"
          { cat "$RUNNER_TEMP/drift.md"; echo; echo "Candidate re-import PR: ${PR_URL:-not created}"; } > "$body"
          number=$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --title 'Upstream Postman contract drift' --label upstream-drift --body-file "$body"
          else
            gh issue edit "$number" --body-file "$body"
          fi
