name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      # Drift gate: fail when the endpoint catalog / security catalog /
      # docs / llms.txt are stale relative to ENDPOINT_REGISTRY. Regenerate
      # with `npm run contracts:generate && npm run docs:generate`.
      - run: npm run contracts:check
      - run: npm run build
