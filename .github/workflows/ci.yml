name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run CI on'
        required: false
        default: 'main'

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      # Drift gate: fail when the endpoint catalog / security catalog /
      # docs / llms.txt are stale relative to ENDPOINT_REGISTRY. Regenerate
      # with `npm run contracts:generate && npm run docs:generate`.
      - run: npm run contracts:check
      # Wave 11 — Postman contract coverage regression gate.
      # Downloads the official Binance Postman collection, regenerates the
      # contract catalog, and fails if the SDK is missing any endpoint that
      # exists in the official collection. The coverage report is written
      # to contracts/postman-coverage.json for inspection.
      - name: Postman contract coverage gate
        env:
          # Pinned upstream revision, so coverage results are reproducible run-to-run
          # instead of tracking the moving master HEAD. Bump this deliberately:
          # upstream-watch flags drift on new upstream commits and opens a PR
          # that re-imports the catalog (contracts/postman-catalog.json records
          # the same pinnedSha).
          POSTMAN_REF: 2dbd378be100f170d859d56fcd0ec23457a72d30
        run: |
          # Download the official Binance Postman collections (if not cached).
          if [ ! -d "../postman-extract/binance-api-postman-${POSTMAN_REF}/collections" ]; then
            rm -rf ../postman-extract && mkdir -p ../postman-extract
            curl -sSL "https://github.com/binance/binance-api-postman/archive/${POSTMAN_REF}.tar.gz" \
              | tar xz -C ../postman-extract
          fi
          POSTMAN_COLLECTIONS_DIR="../postman-extract/binance-api-postman-${POSTMAN_REF}/collections" \
            npm run contracts:import-postman -- --ref "$POSTMAN_REF"
          npm run contracts:generate-from-postman
          # Fail if any endpoints are missing from the SDK relative to the contract.
          node -e "
            const cov = require('./contracts/postman-coverage.json');
            const totalMissing = cov.products.reduce((a, p) => a + p.missing.length, 0);
            if (totalMissing > 0) {
              console.error('Postman contract coverage regression:', totalMissing, 'endpoints missing.');
              for (const p of cov.products) {
                if (p.missing.length > 0) {
                  console.error('  ' + p.product + ': ' + p.missing.length + ' missing');
                }
              }
              process.exit(1);
            }
            console.log('Postman contract coverage: 100% match (' + cov.products.reduce((a, p) => a + p.existingCount, 0) + ' endpoints).');
          "
      - run: npm run build
      # Footprint gate: the publishable artifact must stay map-free and
      # within the unpacked-size budget (scripts/check-package-footprint.ts).
      - run: npm run package:check-footprint
